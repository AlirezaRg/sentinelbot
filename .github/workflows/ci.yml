name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python lint and types (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [agent, detection, database, alerts, ai, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local packages in dependency order
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./agent -e ./detection -e ./database -e ./alerts -e ./ai -e ./backend
          python -m pip install -e "./${{ matrix.package }}[dev]"
      - name: Format check
        working-directory: ${{ matrix.package }}
        run: ruff format --check src tests
      - name: Lint
        working-directory: ${{ matrix.package }}
        run: ruff check src tests
      - name: Type check
        working-directory: ${{ matrix.package }}
        run: mypy
      - name: Unit tests
        working-directory: ${{ matrix.package }}
        run: pytest -q

  integration:
    name: Integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SENTINEL_TEST_DATABASE_URL: postgresql+psycopg://sentinel:ci-only-password@127.0.0.1:5432/sentinel_test
      SENTINEL_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./agent -e ./detection -e ./database -e ./alerts -e ./ai -e ./backend
          python -m pip install -e "./backend[dev]" -e "./detection[dev]" -e "./database[dev]"
      - name: Migrations apply and match the models
        working-directory: database
        env:
          SENTINEL_DATABASE_URL: ${{ env.SENTINEL_TEST_DATABASE_URL }}
        run: |
          alembic -c alembic.ini upgrade head
          pytest -q
      - name: Detection against real Redis
        working-directory: detection
        run: pytest -q
      - name: API against PostgreSQL and Redis
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  images:
    name: Build images and scan them
    runs-on: ubuntu-latest
    needs: [python-checks, integration, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t sentinelbot-api:ci .
      - name: Build agent image
        run: docker build -f docker/agent.Dockerfile -t sentinelbot-agent:ci .
      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t sentinelbot-frontend:ci .
      - name: Scan API image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sentinelbot-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan agent image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sentinelbot-agent:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sentinelbot-frontend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  dependency-audit:
    name: Dependency audit (pip-audit and npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ./agent -e ./detection -e ./database -e ./alerts -e ./ai -e ./backend
          pip-audit --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
