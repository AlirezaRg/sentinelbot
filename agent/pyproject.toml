[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelbot-agent"
version = "0.1.0"
description = "SentinelBot host telemetry agent (Phase 1: system, process and network collection)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psutil>=5.9",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-psutil>=5.9",
]

[project.scripts]
sentinelbot-agent = "sentinelbot_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinelbot_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: runs real collectors against the local host (read-only)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["psutil.*"]
ignore_missing_imports = true
