[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelbot-detection"
version = "0.1.0"
description = "SentinelBot transparent rule-based detection engine (Phase 3)"
requires-python = ">=3.12"
dependencies = ["sentinelbot-agent>=0.1.0", "redis>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "fakeredis>=2.20"]

[project.scripts]
sentinelbot-detect = "sentinelbot_detection.cli:main"
sentinelbot-correlate = "sentinelbot_detection.correlate_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinelbot_detection = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]
