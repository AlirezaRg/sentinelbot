apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sentinelbot
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: sentinelbot-api
        metrics_path: /metrics
        static_configs:
          - targets: ["sentinel-api:8000"]
        http_headers:
          X-API-Key:
            files:
              - /etc/prometheus/secret/SENTINEL_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sentinelbot
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sentinelbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: api-key
              mountPath: /etc/prometheus/secret
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: api-key
          secret:
            secretName: sentinelbot-secrets
            items:
              - key: SENTINEL_API_KEY
                path: SENTINEL_API_KEY
        - name: data
          emptyDir: {}
