# Copy to secret.yaml, replace every CHANGE_ME, and apply it. Never commit secret.yaml.
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
# Generate values with:  openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: sentinelbot-secrets
  namespace: sentinelbot
type: Opaque
stringData:
  POSTGRES_PASSWORD: CHANGE_ME
  DATABASE_URL: postgresql+psycopg://sentinel:CHANGE_ME@postgres:5432/sentinel
  SENTINEL_API_KEY: CHANGE_ME_AT_LEAST_24_CHARS
  SENTINEL_AUTH_SECRET: CHANGE_ME_AT_LEAST_32_CHARS
  GRAFANA_ADMIN_PASSWORD: CHANGE_ME
