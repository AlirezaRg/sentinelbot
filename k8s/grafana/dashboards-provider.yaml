apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: sentinelbot
data:
  sentinelbot.yml: |
    apiVersion: 1
    providers:
      - name: sentinelbot
        orgId: 1
        folder: SentinelBot
        type: file
        disableDeletion: true
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
